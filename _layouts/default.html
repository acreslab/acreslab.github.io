<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | University of Minnesota{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <!-- browser tab icon: the robot head from the logo -->
    <link rel="icon" href="{{ '/images/logo/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/images/logo/favicon-32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/images/logo/apple-touch-icon.png' | relative_url }}">
    <!-- link previews (Slack, WeChat, email, social media) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | University of Minnesota{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/logo/og-image.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script>
        // apply a saved dark theme before first paint (no white flash)
        try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
</head>
<body>

    {% include header.html %}

    <main class="container">
{{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/script.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
