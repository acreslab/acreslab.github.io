<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 9 166 166">
    <!-- browser tab icon: the "A" (with its drone) from the ACRES logo -->
    <defs>
        <!-- sky → water → field, top to bottom across the whole word -->
