            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="0.55" stop-color="#0f766e"/>
            <stop offset="1" stop-color="#65a30d"/>
        </linearGradient>
    </defs>
    <g id="A">
        <g fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M28 160 75 52l47 108"/>
