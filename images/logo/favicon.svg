            <ellipse cx="106" cy="16" rx="19" ry="4.2" fill="url(#acres-grad)"/>
        </g>
        <circle cx="54" cy="120" r="4.2" fill="#fff"/>
        <circle cx="96" cy="120" r="4.2" fill="#fff"/>
    </g>

</svg>
