<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 4 614 173" width="614" height="173" role="img" aria-label="ACRES Lab">
    <defs>
        <!-- sky → water → field, top to bottom across the whole word -->
        <linearGradient id="acres-grad" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="172">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="0.55" stop-color="#0f766e"/>
            <stop offset="1" stop-color="#65a30d"/>
        </linearGradient>
    </defs>

    <!-- A: quadcopter on the peak, pinned crossbar -->
    <g id="A">
        <g fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M28 160 75 52l47 108"/>
            <path d="M54 120h42" stroke-width="20"/>
        </g>
        <g fill="url(#acres-grad)">
            <path d="M44 33h62" stroke="url(#acres-grad)" stroke-width="7" stroke-linecap="round"/>
            <rect x="61" y="25" width="28" height="17" rx="7"/>
            <path d="M44 33V20M106 33V20" stroke="url(#acres-grad)" stroke-width="6" stroke-linecap="round"/>
            <ellipse cx="44" cy="16" rx="19" ry="4.2" fill="url(#acres-grad)"/>
            <ellipse cx="106" cy="16" rx="19" ry="4.2" fill="url(#acres-grad)"/>
        </g>
        <circle cx="54" cy="120" r="4.2" fill="#fff"/>
        <circle cx="96" cy="120" r="4.2" fill="#fff"/>
    </g>

    <!-- C: camera / sensor eye (perception) -->
    <g id="C" transform="translate(10 0)">
        <path d="M238 70a48 48 0 1 0 0 60" fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round"/>
        <circle cx="200" cy="100" r="15" fill="url(#acres-grad)"/>
        <circle cx="200" cy="100" r="7" fill="#fff"/>
        <circle cx="200" cy="100" r="3.2" fill="url(#acres-grad)"/>
        <g transform="translate(-190 20)">
            <path d="M430 39c0-9 2-15 6-20" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M436 23c2-10 11-15 21-13-1 10-10 16-21 13z" fill="#10b981"/>
            <path d="M432 30c-7-6-16-6-22-1 6 7 15 7 22 1z" fill="#10b981"/>
        </g>
    </g>

    <!-- R: robot head with antenna and face screen -->
    <g id="R" transform="translate(34 0)">
        <g fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M275 160V52h36a28 28 0 0 1 0 56h-36"/>
            <path d="M306 108l36 52"/>
        </g>
        <path d="M296 39V24" stroke="url(#acres-grad)" stroke-width="5" stroke-linecap="round"/>
        <circle cx="296" cy="20" r="7" fill="url(#acres-grad)"/>
        <rect x="292" y="69" width="27" height="22" rx="7" fill="url(#acres-grad)"/>
        <circle cx="300" cy="80" r="3.6" fill="#fff"/>
        <circle cx="312" cy="80" r="3.6" fill="#fff"/>
    </g>

    <!-- E: robot arm (manipulation): pinned joints, gripper picking a fruit -->
    <g id="E" transform="translate(42 0)">
        <g fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
            <path d="M424 52h-46v108h68"/>
            <path d="M378 106h44"/>
        </g>
        <!-- wrist + gripper -->
        <g fill="none" stroke="url(#acres-grad)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M424 52h22" stroke-width="14"/>
            <path d="M448 30v44" stroke-width="10"/>
            <path d="M448 30h17l6 8M448 74h17l6-8" stroke-width="8.5"/>
        </g>
        <!-- fruit with a leaf, held between the fingers -->
        <circle cx="469" cy="52" r="11.5" fill="#ef6f61"/>
        <path d="M470 40.5c1.5-5.5 5.5-8.5 11-8.5-1.5 5.5-5.5 8.5-11 8.5z" fill="#10b981"/>
        <circle cx="465" cy="48" r="2.6" fill="#fff" fill-opacity=".7"/>
        <!-- joints -->
        <circle cx="378" cy="52" r="4.2" fill="#fff"/>
        <circle cx="378" cy="106" r="4.2" fill="#fff"/>
        <circle cx="378" cy="160" r="4.2" fill="#fff"/>
        <circle cx="424" cy="52" r="4.2" fill="#fff"/>
    </g>

    <!-- S: a road with a rover on it -->
    <g id="S" transform="translate(52 0)">
        <path d="M556 66c-12-16-42-20-58-8-17 13-8 34 14 40 24 7 46 15 42 38-4 21-36 30-62 12" fill="none" stroke="url(#acres-grad)" stroke-width="26" stroke-linecap="round"/>
        <path d="M556 66c-12-16-42-20-58-8-17 13-8 34 14 40 24 7 46 15 42 38-4 21-36 30-62 12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 9"/>
        <g fill="url(#acres-grad)">
            <rect x="505" y="20" width="30" height="11" rx="3.5" fill="url(#acres-grad)"/>
            <rect x="511" y="13" width="12" height="8" rx="2.5"/>
            <path d="M529 20v-7" stroke="url(#acres-grad)" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="529" cy="11.5" r="2.6"/>
        </g>
        <circle cx="511" cy="33" r="4.6" fill="#1e3a8a" stroke="#fff" stroke-width="2"/>
        <circle cx="529" cy="33" r="4.6" fill="#1e3a8a" stroke="#fff" stroke-width="2"/>
    </g>

</svg>
