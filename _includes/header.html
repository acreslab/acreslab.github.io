<header class="site-header">
    <div class="container nav-row">
        <a href="{{ '/' | relative_url }}" class="brand">
            <img class="logo-light" src="{{ '/images/logo/acres-logo.svg' | relative_url }}" alt="{{ site.title }}" width="185" height="52">
            <img class="logo-dark" src="{{ '/images/logo/acres-logo-dark.svg' | relative_url }}" alt="{{ site.title }}" width="185" height="52">
        </a>
        <nav class="site-nav">
            {%- for item in site.data.navigation %}
            <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
            {%- endfor %}
        </nav>
        <button class="theme-toggle" type="button" aria-label="Switch between light and dark background" aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
    </div>
</header>
